<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CloudTask v1.0</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #dbeafe, #ede9fe, #f8fafc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: #1e293b;
    }

    .app {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(30, 41, 59, 0.15);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* ENCABEZADO */

    .header {
      background: linear-gradient(135deg, #1d4ed8, #4f46e5, #7c3aed);
      color: white;
      padding: 30px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-size: 34px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .header p {
      opacity: 0.92;
      font-size: 15px;
    }

    .version {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 13px;
      font-weight: 600;
    }

    /* CONTENIDO */

    .content {
      padding: 28px;
    }

    /* CAMPO DE NUEVA TAREA */

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 16px;
      color: #1e293b;
      background: #f8fafc;
      outline: none;
      transition: 0.25s;
    }

    input[type="text"]:focus {
      border-color: #6366f1;
      background: white;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    button {
      cursor: pointer;
      font-family: inherit;
      transition: all 0.25s ease;
    }

    /* BOTÓN AGREGAR */

    #addTaskBtn {
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #6366f1);
      color: white;
      padding: 14px 20px;
      font-weight: bold;
      box-shadow: 0 5px 12px rgba(37, 99, 235, 0.25);
    }

    #addTaskBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.35);
    }

    #addTaskBtn:active {
      transform: translateY(0);
    }

    /* FILTROS */

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid #e2e8f0;
      background: #f1f5f9;
      color: #475569;
      padding: 9px 15px;
      border-radius: 20px;
      font-weight: 500;
    }

    .filter-btn:hover {
      background: #e0e7ff;
      color: #4338ca;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #2563eb, #6366f1);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
    }

    /* LISTA DE TAREAS */

    .task-list {
      list-style: none;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: all 0.25s ease;
    }

    .task:hover {
      transform: translateX(3px);
      border-color: #c7d2fe;
      box-shadow: 0 5px 15px rgba(30, 41, 59, 0.08);
      background: #ffffff;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4f46e5;
      cursor: pointer;
    }

    .task-text {
      font-size: 15px;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    /* BOTÓN ELIMINAR */

    .delete-btn {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
    }

    .delete-btn:hover {
      background: #dc2626;
      color: white;
      transform: scale(1.03);
    }

    /* RESUMEN */

    .summary {
      margin-top: 22px;
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      color: #3730a3;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #6366f1;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.08);
    }

    .summary strong {
      font-size: 18px;
      margin-left: 4px;
    }

    /* MENSAJE CUANDO NO HAY TAREAS */

    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 25px;
      background: #f8fafc;
      border-radius: 10px;
    }

    /* PIE DE PÁGINA */

    footer {
      text-align: center;
      border-top: 1px solid #e2e8f0;
      padding: 18px;
      color: #64748b;
      font-size: 13px;
      background: #f8fafc;
    }

.student-name {
  display: block;
  margin-top: 8px;
  color: #4f46e5;
  font-weight: 600;
}

.student-name strong {
  display: block;
  margin-bottom: 5px;
  color: #64748b;
  font-weight: 500;
}

.members {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

.members span {
  white-space: nowrap;
  font-size: 12px;
}

.members span::first-letter {
  color: #6366f1;
}
    /* ADAPTACIÓN PARA CELULAR */

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .header {
        padding: 25px 20px;
      }

      .header h1 {
        font-size: 29px;
      }

      .content {
        padding: 20px;
      }

      .input-group {
        flex-direction: column;
      }

      #addTaskBtn {
        width: 100%;
      }

      .task {
        padding: 13px;
      }

    }

  </style>

</head>

<body>

  <div class="app">

    <div class="header">

      <h1>☁ CloudTask</h1>

      <p>Gestor de tareas interactivo</p>

      <span class="version">Versión 1.0</span>

    </div>

    <div class="content">

      <div class="input-group">

        <input
          id="taskInput"
          type="text"
          placeholder="Escribe una nueva tarea..."
        >

        <button id="addTaskBtn">
          Agregar
        </button>

      </div>

      <div class="filters">

        <button class="filter-btn active" data-filter="all">
          Todas
        </button>

        <button class="filter-btn" data-filter="pending">
          Pendientes
        </button>

        <button class="filter-btn" data-filter="completed">
          Completadas
        </button>

      </div>

      <ul id="taskList" class="task-list"></ul>

      <div class="summary">

        Tareas pendientes:

        <strong id="pendingCount">0</strong>

      </div>

    </div>

    <footer>

      CloudTask v1.0 · Práctica de Computación en la Nube

<span class="student-name">
  <strong>Desarrollado por:</strong>

  <span class="members">
    <span>● César Luis Navia Murillo</span>
    <span>● Guillermo Elias Moreira Loor</span>
    <span>● Carlos Eduardo Mendoza Delgado</span>
  </span>
</span>

    </footer>

  </div>

  <script>

    const taskInput = document.getElementById("taskInput");

    const addTaskBtn = document.getElementById("addTaskBtn");

    const taskList = document.getElementById("taskList");

    const pendingCount = document.getElementById("pendingCount");

    const filterButtons = document.querySelectorAll(".filter-btn");

    let currentFilter = "all";

    let tasks = [

      {
        id: 1,
        text: "Subir proyecto a GitHub",
        completed: false
      },

      {
        id: 2,
        text: "Desplegar aplicación en Vercel",
        completed: false
      },

      {
        id: 3,
        text: "Probar aplicación desde el teléfono",
        completed: true
      }

    ];

    function renderTasks() {

      taskList.innerHTML = "";

      const filteredTasks = tasks.filter(task => {

        if (currentFilter === "pending") {
          return !task.completed;
        }

        if (currentFilter === "completed") {
          return task.completed;
        }

        return true;

      });

      if (filteredTasks.length === 0) {

        taskList.innerHTML =
          '<li class="empty">No hay tareas para mostrar</li>';

      }

      filteredTasks.forEach(task => {

        const li = document.createElement("li");

        li.className = "task";

        if (task.completed) {
          li.classList.add("completed");
        }

        li.innerHTML = `

          <div class="task-left">

            <input
              type="checkbox"
              ${task.completed ? "checked" : ""}
              onchange="toggleTask(${task.id})"
            >

            <span class="task-text">
              ${task.text}
            </span>

          </div>

          <button
            class="delete-btn"
            onclick="deleteTask(${task.id})"
          >
            Eliminar
          </button>

        `;

        taskList.appendChild(li);

      });

      updatePendingCount();

    }

    function addTask() {

      const text = taskInput.value.trim();

      if (text === "") {

        alert("Escribe una tarea.");

        return;

      }

      tasks.push({

        id: Date.now(),

        text,

        completed: false

      });

      taskInput.value = "";

      renderTasks();

    }

    function toggleTask(id) {

      tasks = tasks.map(task =>

        task.id === id

          ? {
              ...task,
              completed: !task.completed
            }

          : task

      );

      renderTasks();

    }

    function deleteTask(id) {

      tasks = tasks.filter(task => task.id !== id);

      renderTasks();

    }

    function updatePendingCount() {

      pendingCount.textContent =
        tasks.filter(task => !task.completed).length;

    }

    addTaskBtn.addEventListener("click", addTask);

    taskInput.addEventListener("keypress", event => {

      if (event.key === "Enter") {
        addTask();
      }

    });

    filterButtons.forEach(button => {

      button.addEventListener("click", function() {

        filterButtons.forEach(btn =>
          btn.classList.remove("active")
        );

        this.classList.add("active");

        currentFilter = this.dataset.filter;

        renderTasks();

      });

    });

    renderTasks();

  </script>

</body>

</html>
