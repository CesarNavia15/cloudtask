<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTask v1.2</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #dbeafe, #ede9fe, #f8fafc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: #1f2937;
    }

    .app {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    /* ENCABEZADO */

    .header {
      background: linear-gradient(135deg, #1d4ed8, #4f46e5, #7c3aed);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 15px;
      opacity: 0.95;
    }

    .version {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    /* CONTENIDO */

    .content {
      padding: 28px;
    }

    /* CREAR TAREA */

    .input-group {
      display: grid;
      grid-template-columns: 1fr 155px 170px 120px;
      gap: 10px;
      margin-bottom: 18px;
    }

    input,
    select {
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      background: white;
      color: #1f2937;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    /* BOTÓN AGREGAR */

    #addTaskBtn {
      border: none;
      background: linear-gradient(135deg, #2563eb, #6366f1);
      color: white;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 5px 12px rgba(79, 70, 229, 0.2);
    }

    #addTaskBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.3);
    }

    /* BÚSQUEDA Y ORDENAMIENTO */

    .search-sort {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding-left: 40px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 16px;
      pointer-events: none;
    }

    /* BARRA DE HERRAMIENTAS */

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: none;
      background: #f1f5f9;
      color: #475569;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    .filter-btn:hover {
      background: #e0e7ff;
      color: #4338ca;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #2563eb, #6366f1);
      color: white;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
    }

    /* ELIMINAR COMPLETADAS */

    .clear-btn {
      border: none;
      background: #fff7ed;
      color: #ea580c;
      padding: 9px 15px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .clear-btn:hover {
      background: #ffedd5;
      transform: translateY(-1px);
    }

    /* LISTA DE TAREAS */

    .task-list {
      list-style: none;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      padding: 15px 16px;
      margin-bottom: 11px;
      transition: 0.2s;
    }

    .task:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(15, 23, 42, 0.08);
      border-color: #c7d2fe;
    }

    .task-left {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .task-text {
      word-break: break-word;
      font-size: 15px;
      font-weight: 500;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    /* INFORMACIÓN DE LA TAREA */

    .task-details {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    /* PRIORIDADES */

    .priority {
      width: fit-content;
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    .priority-baja {
      background: #dcfce7;
      color: #166534;
    }

    .priority-media {
      background: #fef3c7;
      color: #92400e;
    }

    .priority-alta {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* FECHA */

    .due-date {
      width: fit-content;
      padding: 4px 9px;
      border-radius: 12px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 11px;
      font-weight: 600;
    }

    .overdue {
      background: #fee2e2;
      color: #b91c1c;
    }

    .completed-date {
      background: #dcfce7;
      color: #166534;
    }

    /* BOTONES DE ACCIÓN */

    .task-actions {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    .edit-btn,
    .delete-btn {
      border: none;
      border-radius: 8px;
      padding: 8px 11px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .edit-btn {
      background: #e0e7ff;
      color: #4338ca;
    }

    .edit-btn:hover {
      background: #c7d2fe;
      transform: scale(1.03);
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
    }

    .delete-btn:hover {
      background: #fecaca;
      transform: scale(1.03);
    }

    /* RESUMEN */

    .summary {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary-card {
      background: linear-gradient(135deg, #eff6ff, #eef2ff);
      color: #3730a3;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #e0e7ff;
    }

    .summary-card strong {
      display: block;
      font-size: 25px;
      margin-top: 5px;
    }

    /* MENSAJE VACÍO */

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 30px 20px;
      font-size: 14px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid #e5e7eb;
      text-align: center;
      padding: 18px;
      color: #6b7280;
      font-size: 13px;
      background: #fafafa;
    }

    .student-name {
      display: block;
      margin-top: 8px;
      color: #4f46e5;
      font-weight: 600;
    }

    .student-name strong {
      display: block;
      margin-bottom: 7px;
      color: #64748b;
      font-weight: 500;
    }

    .members {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .members span {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 12px;
    }

    .members i {
      width: 6px;
      height: 6px;
      background: #6366f1;
      border-radius: 50%;
      display: inline-block;
    }

    /* RESPONSIVE */

    @media (max-width: 800px) {

      body {
        padding: 15px;
      }

      .content {
        padding: 20px;
      }

      .input-group {
        grid-template-columns: 1fr 1fr;
      }

      #taskInput {
        grid-column: 1 / -1;
      }

      #addTaskBtn {
        min-height: 45px;
      }

      .search-sort {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: stretch;
      }

      .filters {
        width: 100%;
      }

      .filter-btn {
        flex: 1;
      }

      .clear-btn {
        width: 100%;
      }

      .task {
        align-items: flex-start;
      }

      .task-actions {
        flex-direction: column;
      }

      .student-name {
        text-align: center;
      }

      .members {
        flex-direction: column;
        gap: 7px;
      }
    }

    @media (max-width: 500px) {

      .header {
        padding: 24px 18px;
      }

      .header h1 {
        font-size: 27px;
      }

      .input-group {
        grid-template-columns: 1fr;
      }

      #taskInput {
        grid-column: auto;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .task {
        flex-direction: column;
      }

      .task-actions {
        width: 100%;
        flex-direction: row;
      }

      .edit-btn,
      .delete-btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ENCABEZADO -->

    <div class="header">

      <h1>☁ CloudTask</h1>

      <p>Gestor de tareas interactivo</p>

      <span class="version">
        Versión 1.2
      </span>

    </div>


    <!-- CONTENIDO -->

    <div class="content">

      <!-- CREAR TAREA -->

      <div class="input-group">

        <input
          id="taskInput"
          type="text"
          placeholder="Escribe una nueva tarea..."
        >

        <select id="prioritySelect">

          <option value="baja">
            Prioridad baja
          </option>

          <option value="media" selected>
            Prioridad media
          </option>

          <option value="alta">
            Prioridad alta
          </option>

        </select>

        <input
          id="dueDateInput"
          type="date"
          title="Fecha de vencimiento"
        >

        <button id="addTaskBtn">
          Agregar
        </button>

      </div>


      <!-- BUSCAR Y ORDENAR -->

      <div class="search-sort">

        <div class="search-box">

          <span class="search-icon">
            🔎
          </span>

          <input
            id="searchInput"
            type="text"
            placeholder="Buscar tareas..."
          >

        </div>


        <select id="sortSelect">

          <option value="default">
            Orden original
          </option>

          <option value="priority">
            Ordenar por prioridad
          </option>

          <option value="date">
            Ordenar por fecha
          </option>

          <option value="status">
            Pendientes primero
          </option>

        </select>

      </div>


      <!-- FILTROS -->

      <div class="toolbar">

        <div class="filters">

          <button
            class="filter-btn active"
            data-filter="all"
          >
            Todas
          </button>

          <button
            class="filter-btn"
            data-filter="pending"
          >
            Pendientes
          </button>

          <button
            class="filter-btn"
            data-filter="completed"
          >
            Completadas
          </button>

        </div>


        <button
          id="clearCompletedBtn"
          class="clear-btn"
        >
          Eliminar completadas
        </button>

      </div>


      <!-- LISTA DE TAREAS -->

      <ul
        id="taskList"
        class="task-list"
      ></ul>


      <!-- CONTADORES -->

      <div class="summary">

        <div class="summary-card">

          Total de tareas

          <strong id="totalCount">
            0
          </strong>

        </div>


        <div class="summary-card">

          Tareas pendientes

          <strong id="pendingCount">
            0
          </strong>

        </div>

      </div>

    </div>


    <!-- FOOTER -->

    <footer>

      CloudTask v1.2 · GitHub + Vercel / Netlify

      <span class="student-name">

        <strong>
          Desarrollado por:
        </strong>

        <span class="members">

          <span>
            <i></i>
            César Luis Navia Murillo
          </span>

          <span>
            <i></i>
            Guillermo Elias Moreira Loor
          </span>

          <span>
            <i></i>
            Carlos Eduardo Mendoza Delgado
          </span>

        </span>

      </span>

    </footer>

  </div>


  <script>

    // ELEMENTOS DEL HTML

    const taskInput =
      document.getElementById("taskInput");

    const prioritySelect =
      document.getElementById("prioritySelect");

    const dueDateInput =
      document.getElementById("dueDateInput");

    const addTaskBtn =
      document.getElementById("addTaskBtn");

    const searchInput =
      document.getElementById("searchInput");

    const sortSelect =
      document.getElementById("sortSelect");

    const taskList =
      document.getElementById("taskList");

    const pendingCount =
      document.getElementById("pendingCount");

    const totalCount =
      document.getElementById("totalCount");

    const filterButtons =
      document.querySelectorAll(".filter-btn");

    const clearCompletedBtn =
      document.getElementById("clearCompletedBtn");


    // FILTRO ACTUAL

    let currentFilter = "all";


    // CARGAR TAREAS

    let tasks =
      JSON.parse(
        localStorage.getItem("cloudTaskTasks")
      );


    // TAREAS INICIALES

    if (!tasks) {

      tasks = [

        {
          id: 1,
          text: "Subir proyecto a GitHub",
          completed: false,
          priority: "alta",
          dueDate: ""
        },

        {
          id: 2,
          text: "Desplegar aplicación en Vercel",
          completed: false,
          priority: "media",
          dueDate: ""
        },

        {
          id: 3,
          text: "Probar aplicación desde el teléfono",
          completed: true,
          priority: "baja",
          dueDate: ""
        }

      ];

    }


    // COMPATIBILIDAD CON TAREAS DE v1.1

    tasks = tasks.map(task => {

      if (!task.priority) {
        task.priority = "media";
      }

      if (!task.hasOwnProperty("dueDate")) {
        task.dueDate = "";
      }

      return task;

    });


    // GUARDAR TAREAS

    function saveTasks() {

      localStorage.setItem(
        "cloudTaskTasks",
        JSON.stringify(tasks)
      );

    }


    // COMPROBAR SI UNA TAREA ESTÁ VENCIDA

    function isOverdue(task) {

      if (
        task.completed ||
        !task.dueDate
      ) {
        return false;
      }

      const today =
        new Date().toISOString().split("T")[0];

      return task.dueDate < today;

    }


    // FORMATEAR FECHA

    function formatDate(date) {

      if (!date) {
        return "";
      }

      const parts =
        date.split("-");

      return `${parts[2]}/${parts[1]}/${parts[0]}`;

    }


    // MOSTRAR TAREAS

    function renderTasks() {

      taskList.innerHTML = "";


      const searchText =
        searchInput.value
          .trim()
          .toLowerCase();


      let filteredTasks =
        tasks.filter(task => {

          // FILTRO

          if (
            currentFilter === "pending" &&
            task.completed
          ) {
            return false;
          }

          if (
            currentFilter === "completed" &&
            !task.completed
          ) {
            return false;
          }


          // BÚSQUEDA

          if (
            searchText &&
            !task.text
              .toLowerCase()
              .includes(searchText)
          ) {
            return false;
          }


          return true;

        });


      // ORDENAMIENTO

      const sortType =
        sortSelect.value;


      if (sortType === "priority") {

        const priorityOrder = {
          alta: 1,
          media: 2,
          baja: 3
        };

        filteredTasks.sort(
          (a, b) =>
            priorityOrder[a.priority] -
            priorityOrder[b.priority]
        );

      }


      if (sortType === "date") {

        filteredTasks.sort(
          (a, b) => {

            if (
              !a.dueDate &&
              !b.dueDate
            ) {
              return 0;
            }

            if (!a.dueDate) {
              return 1;
            }

            if (!b.dueDate) {
              return -1;
            }

            return a.dueDate.localeCompare(
              b.dueDate
            );

          }
        );

      }


      if (sortType === "status") {

        filteredTasks.sort(
          (a, b) =>
            Number(a.completed) -
            Number(b.completed)
        );

      }


      // NO HAY RESULTADOS

      if (filteredTasks.length === 0) {

        taskList.innerHTML =
          '<li class="empty">No hay tareas para mostrar</li>';

      }


      // MOSTRAR TAREAS

      filteredTasks.forEach(task => {

        const priorityText = {

          baja: "Baja",
          media: "Media",
          alta: "Alta"

        };


        const li =
          document.createElement("li");


        li.className = "task";


        if (task.completed) {

          li.classList.add("completed");

        }


        let dateHTML = "";


        if (task.dueDate) {

          if (isOverdue(task)) {

            dateHTML = `

              <span class="due-date overdue">
                ⚠ Vencida: ${formatDate(task.dueDate)}
              </span>

            `;

          } else if (task.completed) {

            dateHTML = `

              <span class="due-date completed-date">
                ✓ Vencía: ${formatDate(task.dueDate)}
              </span>

            `;

          } else {

            dateHTML = `

              <span class="due-date">
                📅 ${formatDate(task.dueDate)}
              </span>

            `;

          }

        }


        li.innerHTML = `

          <div class="task-left">

            <input
              type="checkbox"
              ${task.completed ? "checked" : ""}
              onchange="toggleTask(${task.id})"
            >


            <div class="task-info">

              <span class="task-text">
                ${escapeHTML(task.text)}
              </span>


              <div class="task-details">

                <span
                  class="priority priority-${task.priority}"
                >
                  Prioridad ${priorityText[task.priority]}
                </span>

                ${dateHTML}

              </div>

            </div>

          </div>


          <div class="task-actions">

            <button
              class="edit-btn"
              onclick="editTask(${task.id})"
            >
              Editar
            </button>


            <button
              class="delete-btn"
              onclick="deleteTask(${task.id})"
            >
              Eliminar
            </button>

          </div>

        `;


        taskList.appendChild(li);

      });


      updateCounters();

      saveTasks();

    }


    // PROTEGER TEXTO INSERTADO EN HTML

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    // AGREGAR TAREA

    function addTask() {

      const text =
        taskInput.value.trim();


      if (!text) {

        alert(
          "Escribe una tarea."
        );

        return;

      }


      tasks.push({

        id: Date.now(),

        text: text,

        completed: false,

        priority:
          prioritySelect.value,

        dueDate:
          dueDateInput.value

      });


      taskInput.value = "";

      prioritySelect.value = "media";

      dueDateInput.value = "";


      renderTasks();

    }


    // EDITAR TAREA

    function editTask(id) {

      const task =
        tasks.find(
          task => task.id === id
        );


      if (!task) {
        return;
      }


      const newText =
        prompt(
          "Editar tarea:",
          task.text
        );


      if (
        newText === null
      ) {
        return;
      }


      const cleanText =
        newText.trim();


      if (!cleanText) {

        alert(
          "La tarea no puede quedar vacía."
        );

        return;

      }


      const newPriority =
        prompt(
          "Prioridad: baja, media o alta",
          task.priority
        );


      if (
        newPriority === null
      ) {
        return;
      }


      const priority =
        newPriority
          .trim()
          .toLowerCase();


      if (
        !["baja", "media", "alta"]
          .includes(priority)
      ) {

        alert(
          "La prioridad debe ser baja, media o alta."
        );

        return;

      }


      const newDate =
        prompt(
          "Fecha de vencimiento (AAAA-MM-DD). Deja vacío si no tiene fecha:",
          task.dueDate || ""
        );


      if (
        newDate === null
      ) {
        return;
      }


      task.text =
        cleanText;

      task.priority =
        priority;

      task.dueDate =
        newDate.trim();


      renderTasks();

    }


    // CAMBIAR ESTADO

    function toggleTask(id) {

      tasks =
        tasks.map(task =>

          task.id === id

            ? {
                ...task,
                completed:
                  !task.completed
              }

            : task

        );


      renderTasks();

    }


    // ELIMINAR TAREA

    function deleteTask(id) {

      tasks =
        tasks.filter(
          task => task.id !== id
        );


      renderTasks();

    }


    // ELIMINAR COMPLETADAS

    function clearCompletedTasks() {

      if (
        !tasks.some(
          task => task.completed
        )
      ) {

        alert(
          "No hay tareas completadas."
        );

        return;

      }


      if (
        confirm(
          "¿Eliminar todas las tareas completadas?"
        )
      ) {

        tasks =
          tasks.filter(
            task => !task.completed
          );


        renderTasks();

      }

    }


    // ACTUALIZAR CONTADORES

    function updateCounters() {

      totalCount.textContent =
        tasks.length;


      pendingCount.textContent =
        tasks.filter(
          task => !task.completed
        ).length;

    }


    // BOTÓN AGREGAR

    addTaskBtn.addEventListener(
      "click",
      addTask
    );


    // ENTER PARA AGREGAR

    taskInput.addEventListener(
      "keypress",
      event => {

        if (
          event.key === "Enter"
        ) {

          addTask();

        }

      }
    );


    // BÚSQUEDA

    searchInput.addEventListener(
      "input",
      renderTasks
    );


    // ORDENAMIENTO

    sortSelect.addEventListener(
      "change",
      renderTasks
    );


    // ELIMINAR COMPLETADAS

    clearCompletedBtn.addEventListener(
      "click",
      clearCompletedTasks
    );


    // FILTROS

    filterButtons.forEach(button => {

      button.addEventListener(
        "click",
        function() {

          filterButtons.forEach(btn =>
            btn.classList.remove("active")
          );


          this.classList.add("active");


          currentFilter =
            this.dataset.filter;


          renderTasks();

        }
      );

    });


    // INICIAR APLICACIÓN

    renderTasks();

  </script>

</body>
</html>
