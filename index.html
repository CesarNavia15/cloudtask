<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTask v1.1</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #dbeafe, #ede9fe, #f8fafc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: #1f2937;
    }

    .app {
      width: 100%;
      max-width: 820px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    /* ENCABEZADO */

    .header {
      background: linear-gradient(135deg, #1d4ed8, #4f46e5, #7c3aed);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 15px;
      opacity: 0.95;
    }

    .version {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    /* CONTENIDO */

    .content {
      padding: 28px;
    }

    /* INPUT Y PRIORIDAD */

    .input-group {
      display: grid;
      grid-template-columns: 1fr 160px 120px;
      gap: 10px;
      margin-bottom: 24px;
    }

    input,
    select {
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      background: white;
      color: #1f2937;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    /* BOTÓN AGREGAR */

    #addTaskBtn {
      border: none;
      background: linear-gradient(135deg, #2563eb, #6366f1);
      color: white;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 5px 12px rgba(79, 70, 229, 0.2);
    }

    #addTaskBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.3);
    }

    /* BARRA DE HERRAMIENTAS */

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: none;
      background: #f1f5f9;
      color: #475569;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    .filter-btn:hover {
      background: #e0e7ff;
      color: #4338ca;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #2563eb, #6366f1);
      color: white;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
    }

    /* ELIMINAR COMPLETADAS */

    .clear-btn {
      border: none;
      background: #fff7ed;
      color: #ea580c;
      padding: 9px 15px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .clear-btn:hover {
      background: #ffedd5;
      transform: translateY(-1px);
    }

    /* LISTA DE TAREAS */

    .task-list {
      list-style: none;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      padding: 15px 16px;
      margin-bottom: 11px;
      transition: 0.2s;
    }

    .task:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(15, 23, 42, 0.08);
      border-color: #c7d2fe;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .task-text {
      word-break: break-word;
      font-size: 15px;
      font-weight: 500;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    /* PRIORIDADES */

    .priority {
      width: fit-content;
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    .priority-baja {
      background: #dcfce7;
      color: #166534;
    }

    .priority-media {
      background: #fef3c7;
      color: #92400e;
    }

    .priority-alta {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* BOTÓN ELIMINAR */

    .delete-btn {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: #fecaca;
      transform: scale(1.03);
    }

    /* RESUMEN */

    .summary {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary-card {
      background: linear-gradient(135deg, #eff6ff, #eef2ff);
      color: #3730a3;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #e0e7ff;
    }

    .summary-card strong {
      display: block;
      font-size: 25px;
      margin-top: 5px;
    }

    /* MENSAJE VACÍO */

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 30px 20px;
      font-size: 14px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid #e5e7eb;
      text-align: center;
      padding: 18px;
      color: #6b7280;
      font-size: 13px;
      background: #fafafa;
    }

    .student-name {
      display: block;
      margin-top: 8px;
      color: #4f46e5;
      font-weight: 600;
    }

    .student-name strong {
      display: block;
      margin-bottom: 7px;
      color: #64748b;
      font-weight: 500;
    }

    .members {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .members span {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 12px;
    }

    .members i {
      width: 6px;
      height: 6px;
      background: #6366f1;
      border-radius: 50%;
      display: inline-block;
    }

    /* RESPONSIVE */

    @media (max-width: 700px) {

      body {
        padding: 15px;
      }

      .content {
        padding: 20px;
      }

      .input-group,
      .summary {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: stretch;
      }

      .filters {
        width: 100%;
      }

      .filter-btn {
        flex: 1;
      }

      .clear-btn {
        width: 100%;
      }

      .task {
        align-items: flex-start;
      }

      .student-name {
        text-align: center;
      }

      .members {
        flex-direction: column;
        gap: 7px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ENCABEZADO -->

    <div class="header">

      <h1>☁ CloudTask</h1>

      <p>Gestor de tareas interactivo</p>

      <span class="version">
        Versión 1.1
      </span>

    </div>


    <!-- CONTENIDO -->

    <div class="content">

      <!-- CREAR TAREA -->

      <div class="input-group">

        <input
          id="taskInput"
          type="text"
          placeholder="Escribe una nueva tarea..."
        >

        <select id="prioritySelect">

          <option value="baja">
            Prioridad baja
          </option>

          <option value="media" selected>
            Prioridad media
          </option>

          <option value="alta">
            Prioridad alta
          </option>

        </select>

        <button id="addTaskBtn">
          Agregar
        </button>

      </div>


      <!-- FILTROS -->

      <div class="toolbar">

        <div class="filters">

          <button
            class="filter-btn active"
            data-filter="all"
          >
            Todas
          </button>

          <button
            class="filter-btn"
            data-filter="pending"
          >
            Pendientes
          </button>

          <button
            class="filter-btn"
            data-filter="completed"
          >
            Completadas
          </button>

        </div>

        <button
          id="clearCompletedBtn"
          class="clear-btn"
        >
          Eliminar completadas
        </button>

      </div>


      <!-- LISTA DE TAREAS -->

      <ul
        id="taskList"
        class="task-list"
      ></ul>


      <!-- CONTADORES -->

      <div class="summary">

        <div class="summary-card">

          Total de tareas

          <strong id="totalCount">
            0
          </strong>

        </div>

        <div class="summary-card">

          Tareas pendientes

          <strong id="pendingCount">
            0
          </strong>

        </div>

      </div>

    </div>


    <!-- PIE DE PÁGINA -->

    <footer>

      CloudTask v1.1 · GitHub + Vercel / Netlify

      <span class="student-name">

        <strong>
          Desarrollado por:
        </strong>

        <span class="members">

          <span>
            <i></i>
            César Luis Navia Murillo
          </span>

          <span>
            <i></i>
            Guillermo Elias Moreira Loor
          </span>

          <span>
            <i></i>
            Carlos Eduardo Mendoza Delgado
          </span>

        </span>

      </span>

    </footer>

  </div>


  <script>

    // ELEMENTOS DEL HTML

    const taskInput =
      document.getElementById("taskInput");

    const prioritySelect =
      document.getElementById("prioritySelect");

    const addTaskBtn =
      document.getElementById("addTaskBtn");

    const taskList =
      document.getElementById("taskList");

    const pendingCount =
      document.getElementById("pendingCount");

    const totalCount =
      document.getElementById("totalCount");

    const filterButtons =
      document.querySelectorAll(".filter-btn");

    const clearCompletedBtn =
      document.getElementById("clearCompletedBtn");


    // FILTRO ACTUAL

    let currentFilter = "all";


    // CARGAR TAREAS GUARDADAS

    let tasks =
      JSON.parse(
        localStorage.getItem("cloudTaskTasks")
      );


    // TAREAS INICIALES

    if (!tasks) {

      tasks = [

        {
          id: 1,
          text: "Subir proyecto a GitHub",
          completed: false,
          priority: "alta"
        },

        {
          id: 2,
          text: "Desplegar aplicación en Vercel",
          completed: false,
          priority: "media"
        },

        {
          id: 3,
          text: "Probar aplicación desde el teléfono",
          completed: true,
          priority: "baja"
        }

      ];

    }


    // GUARDAR TAREAS

    function saveTasks() {

      localStorage.setItem(
        "cloudTaskTasks",
        JSON.stringify(tasks)
      );

    }


    // MOSTRAR TAREAS

    function renderTasks() {

      taskList.innerHTML = "";


      const filteredTasks =
        tasks.filter(task => {

          if (currentFilter === "pending") {
            return !task.completed;
          }

          if (currentFilter === "completed") {
            return task.completed;
          }

          return true;

        });


      if (filteredTasks.length === 0) {

        taskList.innerHTML =
          '<li class="empty">No hay tareas para mostrar</li>';

      }


      filteredTasks.forEach(task => {

        const priorityText = {

          baja: "Baja",
          media: "Media",
          alta: "Alta"

        };


        const li =
          document.createElement("li");


        li.className = "task";


        if (task.completed) {

          li.classList.add("completed");

        }


        li.innerHTML = `

          <div class="task-left">

            <input
              type="checkbox"
              ${task.completed ? "checked" : ""}
              onchange="toggleTask(${task.id})"
            >

            <div class="task-info">

              <span class="task-text">
                ${task.text}
              </span>

              <span
                class="priority priority-${task.priority}"
              >
                Prioridad ${priorityText[task.priority]}
              </span>

            </div>

          </div>


          <button
            class="delete-btn"
            onclick="deleteTask(${task.id})"
          >
            Eliminar
          </button>

        `;


        taskList.appendChild(li);

      });


      updateCounters();

      saveTasks();

    }


    // AGREGAR TAREA

    function addTask() {

      const text =
        taskInput.value.trim();


      if (!text) {

        alert("Escribe una tarea.");

        return;

      }


      tasks.push({

        id: Date.now(),

        text: text,

        completed: false,

        priority: prioritySelect.value

      });


      taskInput.value = "";

      prioritySelect.value = "media";


      renderTasks();

    }


    // CAMBIAR ESTADO

    function toggleTask(id) {

      tasks =
        tasks.map(task =>

          task.id === id

            ? {
                ...task,
                completed: !task.completed
              }

            : task

        );


      renderTasks();

    }


    // ELIMINAR TAREA

    function deleteTask(id) {

      tasks =
        tasks.filter(
          task => task.id !== id
        );


      renderTasks();

    }


    // ELIMINAR COMPLETADAS

    function clearCompletedTasks() {

      if (!tasks.some(task => task.completed)) {

        alert(
          "No hay tareas completadas."
        );

        return;

      }


      if (
        confirm(
          "¿Eliminar todas las tareas completadas?"
        )
      ) {

        tasks =
          tasks.filter(
            task => !task.completed
          );


        renderTasks();

      }

    }


    // ACTUALIZAR CONTADORES

    function updateCounters() {

      totalCount.textContent =
        tasks.length;


      pendingCount.textContent =
        tasks.filter(
          task => !task.completed
        ).length;

    }


    // BOTÓN AGREGAR

    addTaskBtn.addEventListener(
      "click",
      addTask
    );


    // ENTER PARA AGREGAR

    taskInput.addEventListener(
      "keypress",
      event => {

        if (event.key === "Enter") {

          addTask();

        }

      }
    );


    // ELIMINAR COMPLETADAS

    clearCompletedBtn.addEventListener(
      "click",
      clearCompletedTasks
    );


    // FILTROS

    filterButtons.forEach(button => {

      button.addEventListener(
        "click",
        function() {

          filterButtons.forEach(btn =>
            btn.classList.remove("active")
          );


          this.classList.add("active");


          currentFilter =
            this.dataset.filter;


          renderTasks();

        }
      );

    });


    // INICIAR APLICACIÓN

    renderTasks();

  </script>

</body>
</html>
